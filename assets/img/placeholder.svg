<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125" role="img" aria-label="Product photo coming soon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F7EC"/><stop offset="1" stop-color="#E3EDD8"/>
    </linearGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#F7F9F3"/><stop offset="1" stop-color="#E4EBDD"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2E8B3E"/><stop offset="1" stop-color="#8CC63F"/>
    </linearGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0F3D24" stop-opacity=".22"/><stop offset="1" stop-color="#0F3D24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="1125" fill="url(#bg)"/>
  <circle cx="450" cy="470" r="300" fill="#FFFFFF" opacity=".55"/>
  <ellipse cx="450" cy="772" rx="190" ry="26" fill="url(#shadow)"/>
  <!-- cap -->
  <rect x="345" y="250" width="210" height="92" rx="16" fill="#0F3D24"/>
  <rect x="345" y="262" width="210" height="6" fill="#FFFFFF" opacity=".12"/>
  <rect x="345" y="282" width="210" height="6" fill="#FFFFFF" opacity=".12"/>
  <rect x="345" y="302" width="210" height="6" fill="#FFFFFF" opacity=".12"/>
  <!-- bottle -->
  <rect x="310" y="336" width="280" height="436" rx="40" fill="url(#jar)" stroke="#CCD8C4" stroke-width="3"/>
  <!-- label -->
  <rect x="310" y="430" width="280" height="250" fill="#EAF4E2"/>
  <path d="M450 470c-48 18-70 60-60 108 46-6 78-42 72-96-3-5-8-9-12-12z" fill="url(#leaf)"/>
  <path d="M452 492c-24 22-40 52-46 82" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8"/>
  <text x="450" y="640" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="34" fill="#0F3D24">PHOLA</text>
  <text x="450" y="666" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="3" fill="#2E8B3E">HEALTH SOLUTIONS</text>
  <!-- caption -->
  <text x="450" y="880" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="40" fill="#0F3D24">Pack shot coming soon</text>
  <text x="450" y="926" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#4A5D51">See the in-store photo in the gallery</text>
</svg>
